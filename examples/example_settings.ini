# Bundled notebooks resolve paths relative to examples/ using example_support.py.
# For direct CLI use, supply absolute paths and the required inputs/<tile>/ layout.
[client_folder]
inputs = GRS
output = Outputs
wmask_folder = WaterDetect

[vector_list]
roi_vectors =

[processing]
# ac_processor can be GRS or ACOLITE
ac_processor = GRS
grs_version = v21
# grs_version options:
# v15, v20 (default) or v21 
# grs_version is ignored when ac_processor = ACOLITE
compute_l2b = True
make_report = False
report_rrs = True
parallel = False
s2_tile = 31TCJ
s2_resolution = 20

[timeseries]
l2b_algorithms = [
    # 'CDOM_Brezonik',
    ]

[output_encoding]
encoding_version = GETPAK-ENC-2
rrs_multiplier = 10000000
chla_multiplier = 100
# Legacy setting name retained for the four-OWT Turb output (NTU by default).
turbidity_multiplier = 100
hyspm_multiplier = 100
continuous_dtype = uint32
continuous_nodata = 0
categorical_dtype = uint8
categorical_nodata = 0
